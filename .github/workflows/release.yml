name: Release

# Fluxo de releases (SemVer + Conventional Commits):
#  1. Cada push na master atualiza um PR "chore(master): release X.Y.Z" com o
#     CHANGELOG e a versão nova no pyproject.toml.
#  2. Ao fazer merge desse PR, a tag vX.Y.Z e o GitHub Release são criados e o
#     pacote do código é anexado ao release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes antes de publicar
        working-directory: todo
        run: |
          pip install -r ../requirements.txt
          python manage.py test --noinput
      - name: Empacotar código
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git archive --format=tar.gz --prefix="django-to-do-${TAG}/" -o "django-to-do-${TAG}.tar.gz" "$TAG"
          git archive --format=zip --prefix="django-to-do-${TAG}/" -o "django-to-do-${TAG}.zip" "$TAG"
          sha256sum django-to-do-${TAG}.* > SHA256SUMS.txt
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" django-to-do-${TAG}.tar.gz django-to-do-${TAG}.zip SHA256SUMS.txt --clobber
