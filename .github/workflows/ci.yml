name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8"
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff . || echo "::warning::Código fora do padrão do ruff format"

  django-checks:
    name: Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r ../requirements.txt
      - name: Gerar chave secreta temporária
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: System checks
        run: python manage.py check --fail-level WARNING
      - name: Migrações pendentes
        run: python manage.py makemigrations --check --dry-run
      - name: Migrações aplicam do zero
        run: python manage.py migrate --noinput

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 5.2 LTS suporta Python 3.10 a 3.13
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r ../requirements-dev.txt
      - name: Gerar chave secreta temporária
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Rodar testes com cobertura
        run: |
          coverage run --rcfile=../pyproject.toml manage.py test --noinput \
            --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner
      - name: Relatório de cobertura
        if: always()
        run: |
          coverage report --rcfile=../pyproject.toml | tee coverage.txt
          coverage xml --rcfile=../pyproject.toml -o coverage.xml
          {
            echo "### Cobertura (Python ${{ matrix.python-version }})"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            todo/TEST-*.xml
            todo/coverage.xml

  security:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
